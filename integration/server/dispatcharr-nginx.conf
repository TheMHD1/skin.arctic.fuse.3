# Channel/VOD logos and SD program posters share /data/cache/ with separate zones.
proxy_cache_path /data/cache/logos levels=1:2 keys_zone=logo_cache:10m
                 inactive=7d max_size=1g use_temp_path=off;

proxy_cache_path /data/cache/sd_posters levels=1:2 keys_zone=sd_poster_cache:10m
                 inactive=14d max_size=512m use_temp_path=off;

log_format venom_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent';
server {
    listen NGINX_PORT;
    listen [::]:NGINX_PORT;
    access_log /var/log/nginx/access.log venom_safe;

    proxy_connect_timeout 75;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    # Coalesce artwork misses and refresh stale artwork off the browsing path.
    # These directives only apply to locations that enable proxy_cache.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    client_max_body_size 0;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Serve Django via uWSGI
    location / {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    location /assets/ {
        root /app/static;
    }

    location /static/ {
        root /app;
    }

    location /logos/ {
        root /data;
    }

    # Internal location for X-Accel-Redirect backup downloads
    # Django handles auth, nginx serves the file directly
    location /protected-backups/ {
        internal;
        alias /data/backups/;
    }

    # Optional trailing slash: some clients strip it from artwork URLs.
    # Internal rewrite keeps one proxy_cache key ($uri) for both spellings;
    # Django also accepts slash-less paths for non-nginx deployments.
    location ~ ^/api/channels/logos/(?<logo_id>\d+)/cache/?$ {
        # Artwork must not inherit the 300-second playback read timeout.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_cache_lock_timeout 5s;
        rewrite ^(/api/channels/logos/\d+/cache)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$uri$is_args$args";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
        proxy_cache_valid 404 10m;  # Dead provider logos should not retry on every visit
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location ~ ^/api/vod/vodlogos/(?<logo_id>\d+)/cache/?$ {
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_cache_lock_timeout 5s;
        rewrite ^(/api/vod/vodlogos/\d+/cache)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$uri$is_args$args";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
        proxy_cache_valid 404 10m;  # Dead provider logos should not retry on every visit
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Parent-scoped VOD images (backdrops, episode stills, etc.)
    location ~ ^/api/vod/(movies|series|episodes)/(?<vod_id>\d+)/image/?$ {
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_cache_lock_timeout 5s;
        rewrite ^(/api/vod/(?:movies|series|episodes)/\d+/image)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$uri$is_args$args";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # SD program posters: 14d nginx cache. Clients pass ?v=<hash of sd_icon>
    # Do not add proxy_cache_valid 404 here. Bare HTTP 404s from SD/CDN are treated
    # as transient in the poster proxy (only code 5000 blacklists); a negative cache
    # would delay legitimate retries. Permanent misses are handled in Django/DB.
    location ~ ^/api/epg/programs/(?<prog_id>\d+)/poster/?$ {
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_cache_lock_timeout 5s;
        rewrite ^(/api/epg/programs/\d+/poster)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache sd_poster_cache;
        proxy_cache_key "$scheme$uri$is_args$args";
        proxy_cache_valid 200 14d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Admin UI disabled outside dedicated admin access. Match /admin and all
    # deeper Django admin paths (e.g. /admin/login/), but do not match the
    # three-segment XC stream form /admin/<password>/<channel_id> used when
    # the XC username is literally "admin".
    location ~ ^/admin(?!/[^/]+/[^/]+/?$)(?:/|$) {
        return 301 /login;
    }

    # Route HDHR request to Django
    location /hdhr {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    # WebSockets for real-time communication
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Route TS proxy requests to the dedicated instance
    location /proxy/ {
        # Native UUID playback is for Jellyfin/host only. Kodi uses authenticated
        # XC /live/user/password routes because its router performs source NAT.
        allow 127.0.0.1;
        allow 172.29.0.1;
        allow 172.28.0.2;
        allow 192.168.2.172;
        deny all;
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
    }
}
