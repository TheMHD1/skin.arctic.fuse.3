name: Integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python integration/check.py
      - run: python integration/check-catchup.py
      - run: python integration/server/dovi/test_dovi_reconciler.py
      - run: bash -n integration/server/dovi/dovi-process-queue-20260922.sh
      - run: python integration/release/verify-preservation.py
      - run: python integration/release/kodi/build.py --output "$RUNNER_TEMP/habibi-payload"
      - run: python integration/release/kodi/test_release.py "$RUNNER_TEMP/habibi-payload"
      - run: python integration/release/handoff/test_profile.py
